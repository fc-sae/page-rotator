[package]
name = "page-rotator"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Detecta la orientación de cada página de un PDF y corrige /Rotate sin re-rasterizar"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
clap_complete = "4.6.12"
image = { version = "0.25", default-features = false }
lopdf = "0.42.0"
ort = "=2.0.0-rc.15"
pdfium-render = "0.9.5"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
